version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fakescope_postgres
    environment:
      POSTGRES_USER: fakescope
      POSTGRES_PASSWORD: fakescope_pass
      POSTGRES_DB: fakescope_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fakescope_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fakescope_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fakescope:fakescope_pass@fakescope_postgres:5432/fakescope_db
      REDIS_URL: redis://fakescope_redis:6379
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./backend/app/modules/sources/domains.json:/app/app/modules/sources/domains.json
      - huggingface_cache:/root/.cache/huggingface

volumes:
  postgres_data:
  redis_data:
  huggingface_cache:
